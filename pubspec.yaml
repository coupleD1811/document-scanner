name: scanly
description: "Ứng dụng scan tài liệu cá nhân và bộ công cụ PDF."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  lucide_icons_flutter: ^3.1.15
  camera: ^0.12.0+1
  file_selector: ^1.1.0
  permission_handler: ^11.4.0
  image: ^4.9.2
  document_scan: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
   - images/assets/
   - images/logo/

flutter_native_splash:
  color: "#F7FAFC"
  image: images/logo/splash_icon.png

  android: true
  ios: true

  android_12:
    color: "#F7FAFC"
    image: images/logo/splash_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: images/logo/launcher_icon.png
  remove_alpha_ios: true

  adaptive_icon_background: "#F7FAFC"
  adaptive_icon_foreground: images/logo/launcher_icon.png
